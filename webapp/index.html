<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>דוחות נוכחות באחריות ממונה</title>

	<!--
		Assistant is the design's typeface and the first entry in --mt-font-sans
		(css/tokens.css), but nothing was loading it - so every screen fell back to
		SAP's "72", which ships faces at 300/400/700 only. Anything asking for 800,
		the page titles included, got a browser-synthesised fake bold, which reads
		as a different typeface next to real 700 text like the filter labels.

		Loading the family fixes that at the source: 800 lands on a real ExtraBold
		face and the titles sit in the same typeface as the rest of the screen.

		On a closed network this link will not resolve - self-host the woff2 files
		under webapp/fonts and declare them with @font-face instead. The fallback
		chain keeps the app readable either way.
	-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">

	<!--
		Standalone bootstrap using the public SAPUI5 CDN so the app runs as-is.
		In your real application you already have a bootstrap - just copy the
		view / controller / model / css folders into your project.

		Pinned to the 1.71 maintenance line, which is what the Fiori launchpad this
		app is deployed into runs (1.71.47, SAP_UI on the NetWeaver stack). The
		unversioned CDN URL serves the newest release instead, so local development
		used to run some 40 releases ahead of production - which is exactly how an app
		comes to depend on an API that is not there once it is deployed.

		The line rather than the exact patch on purpose: SAP's CDN only keeps the
		latest patch of 1.71 (today 1.71.84), so /1.71.47/ is a 404. Within one LTS
		minor the API surface is the same and patches are fixes, so this is as close
		as the CDN gets. Keep it in step with the launchpad -
		sap.ui.getVersionInfo({library: "sap.ushell"}) in the FLP console, or its
		About dialog.
	-->
	<script
		id="sap-ui-bootstrap"
		src="https://ui5.sap.com/1.71/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-rtl="true"
		data-sap-ui-language="he"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-frameOptions="trusted"
		data-sap-ui-resourceroots='{ "modtimesheet": "./" }'
		data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
		data-sap-ui-libs="sap.m, sap.ui.core, sap.ui.layout, sap.ui.export, sap.f, sap.ui.table">
	</script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
	<div
		data-sap-ui-component
		data-name="modtimesheet"
		data-id="container"
		data-settings='{ "id" : "modtimesheet" }'
		style="height: 100%">
	</div>
</body>
</html>
