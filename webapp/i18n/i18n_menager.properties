# App texts.
#
# One prefix per screen: hm* דף הבית, ae* נתוני כל העובדים, mr* דוחות נוכחות
# באחריות ממונה, sh* the shell bar. Every visible string in the app comes from a
# key here - the three screens are fully externalised, including the dialogs and
# the toasts their controllers raise.
#
# Encoding is UTF-8. server.js serves .properties as text/plain;charset=utf-8 and
# UI5 does not force a charset of its own, so the Hebrew below arrives intact.
appTitle=Manager Attendance Reports
appDescription=Manager attendance approval worklist

