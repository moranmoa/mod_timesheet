# ============================================================================
# דוחות נוכחות באחריות ממונה - ManagerReports
# ============================================================================
# This screen predates the bundle and carried its Hebrew inline until now. Its
# keys are mr*, and they cover the view, the שליחת תזכורת fragment and every
# string the controller puts on screen.
#
# mrSwitchOn / mrSwitchOff repeat aeSwitchOn / aeSwitchOff on purpose rather
# than sharing them: the bundle is organised one prefix per screen, and the two
# toggles are required to READ the same, not to be the same key. Change one and
# you are meant to decide about the other.

