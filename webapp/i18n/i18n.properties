# App texts.
#
# The דוחות נוכחות באחריות ממונה (ManagerReports) screen predates this bundle and
# still carries its Hebrew inline. The נתוני כל העובדים (AllEmployees) screen is
# fully externalised here - every visible string on it comes from an ae* key.
#
# Encoding is UTF-8. server.js serves .properties as text/plain;charset=utf-8 and
# UI5 does not force a charset of its own, so the Hebrew below arrives intact.
appTitle=Manager Attendance Reports
appDescription=Manager attendance approval worklist

